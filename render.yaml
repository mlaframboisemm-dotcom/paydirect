services:
  - type: web
    name: paydirect
    env: docker
    plan: free
    domains:
      - www.pay.sovereigns.ca
      - pay.sovereigns.ca
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        value: "https://www.pay.sovereigns.ca"
      - key: WISE_WEBHOOK_CALLBACK_URL
        value: "https://www.pay.sovereigns.ca/api/withdrawal/wise/webhooks"
      - key: WISE_WEBHOOK_PUBLIC_KEY_PATH
        value: "config/wise-webhook-public.pem"
      - key: WISE_API_TOKEN
        sync: false
      - key: WISE_CLIENT_ID
        sync: false
      - key: WISE_CLIENT_SECRET
        sync: false
      - key: WISE_CLIENT_KEY
        sync: false
      - key: WISE_PROFILE_ID
        sync: false
      - key: SOV_PIN
        sync: false
        placeholder: "Your 6-digit Sovereign Security PIN"
      - key: SOV_TERMINAL_URL
        value: "https://ais-dev-vsguby4cvne7edjk3z4bzv-522633331757.us-east1.run.app"
      - key: JWT_SECRET
        sync: false
      - key: SOVEREIGN_ENCRYPTION_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_TOTP_SECRET
        sync: false
      - key: SOVEREIGN_ADMIN_EMAILS
        sync: false
      - key: COINBASE_API_KEY_ID
        sync: false
      - key: COINBASE_API_SECRET_RAW
        sync: false
      - key: KRAKEN_API_KEY
        sync: false
      - key: KRAKEN_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET2
        sync: false
      - key: STRIPE_AUTO_TOPUP_ENABLED
        value: "true"
      - key: MAILERSEND_API_KEY
        sync: false
      - key: MAILERSEND_SMS_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
