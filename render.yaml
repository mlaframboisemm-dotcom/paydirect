# Render Blueprint Specification
# See https://render.com/docs/blueprints for details
services:
  - type: web
    name: paydirect
    env: docker
    plan: free
    domains:
      - www.pay.sovereigns.ca
      - pay.sovereigns.ca
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        value: "https://pay.sovereigns.ca"
      - key: WISE_WEBHOOK_CALLBACK_URL
        value: "https://pay.sovereigns.ca/api/withdrawal/wise/webhooks"
      - key: WISE_WEBHOOK_PUBLIC_KEY_PATH
        value: "config/wise-webhook-public.pem"
      - key: WISE_CLIENT_ID
        sync: false
      - key: WISE_CLIENT_SECRET
        sync: false
      - key: WISE_CLIENT_KEY
        sync: false
      - key: SOV_PIN
        sync: false
        placeholder: "Your 6-digit Sovereign Security PIN"
      - key: SOV_TERMINAL_URL
        value: "https://ais-dev-vsguby4cvne7edjk3z4bzv-522633331757.us-east1.run.app"
