services:
  - type: web
    name: sovereigns-pay-direct
    env: node
    plan: starter
    id: srv-d99sus57vvec7386p2p0
    buildCommand: npm run lint && npm run compile_applet
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: WISE_PROFILE_ID
        value: "101924589"
      - key: LEDGER_DB_PATH
        value: "/data/ledger.sqlite"
    # Mounts a secure, permanent storage directory that survives restarts
    disk:
      name: ledger-db-volume
      mountPath: /data
      sizeGB: 1
