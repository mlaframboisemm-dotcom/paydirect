name: Withdrawal Redirect Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  withdrawal-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Application
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Security & Verification Tests
        run: npm test

      - name: Tangerine Withdrawal Redirect Smoke Test
        env:
          NODE_ENV: production
        run: npm run test:withdrawal:tangerine-redirect

      - name: E2E Withdrawal Flow Test
        env:
          NODE_ENV: production
        run: npm run test:e2e

      - name: Tangerine Fallback Finalize Test
        env:
          NODE_ENV: production
        run: npm run test:withdrawal:tangerine-fallback-finalize

