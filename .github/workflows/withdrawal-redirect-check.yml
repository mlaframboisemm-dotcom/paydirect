name: Withdrawal Redirect Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  withdrawal-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Tangerine Withdrawal Redirect Smoke Test
        env:
          NODE_ENV: production
        run: bun run test:withdrawal:tangerine-redirect
